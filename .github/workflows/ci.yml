name: CI

on:
  push:
    branches: [main, stabilize]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libvulkan-dev pkg-config
      - name: Build
        run: cargo build --workspace --release
      - name: Build (singleplayer feature, so the gated code keeps compiling)
        run: cargo build -p mc-client --release --features singleplayer
      # Golden data is derived from Mojang code and is not in CI, so golden tests skip.
      - name: Test
        run: cargo test --workspace --release
        timeout-minutes: 20
